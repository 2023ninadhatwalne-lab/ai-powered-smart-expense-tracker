server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: ai-smart-expense-tracker-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/expense_tracker_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      continue-on-error: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000/ai/v1}
    api-key: ${AI_SERVICE_API_KEY:expensetracker-internal-secret-key-2026}
    timeout-ms: 4000
