<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses - AI Smart Expense Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand-logo">
                    <i class="fas fa-brain"></i>
                </div>
                <div>
                    <div class="brand-title">SmartExpense <span class="brand-badge">AI</span></div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <i class="fas fa-chart-pie"></i>
                    <span>Dashboard</span>
                </a>
                <a href="expenses.html" class="nav-item active">
                    <i class="fas fa-receipt"></i>
                    <span>Expenses</span>
                </a>
                <a href="income.html" class="nav-item">
                    <i class="fas fa-wallet"></i>
                    <span>Income</span>
                </a>
                <a href="budgets.html" class="nav-item">
                    <i class="fas fa-bullseye"></i>
                    <span>Budgets</span>
                </a>
                <a href="analytics.html" class="nav-item">
                    <i class="fas fa-chart-line"></i>
                    <span>Analytics</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-profile-badge">
                    <div class="user-info">
                        <div class="user-avatar" id="user-avatar">U</div>
                        <div class="user-details">
                            <h4 id="user-full-name">User</h4>
                            <p id="user-email">user@example.com</p>
                        </div>
                    </div>
                    <button class="btn-logout" id="btn-logout" title="Logout">
                        <i class="fas fa-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-wrapper">
            <div class="topbar">
                <div class="page-header">
                    <h1>Expense Management</h1>
                    <p>Track, filter, and automatically classify your spending with ML</p>
                </div>
                <div class="topbar-actions">
                    <button id="btn-open-expense-modal" class="btn btn-primary">
                        <i class="fas fa-plus"></i> Add Expense
                    </button>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2><i class="fas fa-list"></i> All Recorded Expenses</h2>
                </div>
                <div class="table-responsive">
                    <table class="custom-table">
                        <thead>
                            <tr>
                                <th>Description</th>
                                <th>Merchant</th>
                                <th>Category</th>
                                <th>Amount</th>
                                <th>Payment Method</th>
                                <th>Date</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="expenses-table-tbody">
                            <!-- Dynamic rows -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Expense Modal -->
    <div class="modal-backdrop" id="expense-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-plus-circle" style="color: var(--accent-primary);"></i> Record New Expense</h3>
                <button class="modal-close" id="btn-close-expense-modal"><i class="fas fa-xmark"></i></button>
            </div>
            <form id="expense-form">
                <div class="form-group">
                    <label>Amount (₹) *</label>
                    <input type="number" id="expense-amount-input" class="form-control" placeholder="0.00" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>Description / Note *</label>
                    <div class="input-with-btn">
                        <input type="text" id="expense-desc-input" class="form-control" placeholder="e.g. Swiggy dinner biryani" required>
                        <button type="button" id="btn-magic-ai" class="btn btn-ai" title="Predict category using Machine Learning">
                            <i class="fas fa-wand-magic-sparkles"></i> AI Suggest
                        </button>
                    </div>
                    <div id="ai-prediction-status"></div>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="expense-category-select" class="form-control">
                        <!-- Loaded dynamically -->
                    </select>
                </div>
                <div class="form-group">
                    <label>Merchant / Payee</label>
                    <input type="text" id="expense-merchant-input" class="form-control" placeholder="e.g. Swiggy, Uber, Amazon">
                </div>
                <div class="form-group">
                    <label>Payment Method</label>
                    <select id="expense-payment-method" class="form-control">
                        <option value="UPI">UPI (GPay / PhonePe / Paytm)</option>
                        <option value="CREDIT_CARD">Credit Card</option>
                        <option value="DEBIT_CARD">Debit Card</option>
                        <option value="CASH">Cash</option>
                        <option value="NET_BANKING">Net Banking</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="expense-date-input" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 8px;">
                    <i class="fas fa-check"></i> Save Expense
                </button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
