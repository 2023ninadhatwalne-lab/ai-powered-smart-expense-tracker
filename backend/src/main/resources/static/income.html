<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Income - AI Smart Expense Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand-logo">
                    <i class="fas fa-brain"></i>
                </div>
                <div>
                    <div class="brand-title">SmartExpense <span class="brand-badge">AI</span></div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <i class="fas fa-chart-pie"></i>
                    <span>Dashboard</span>
                </a>
                <a href="expenses.html" class="nav-item">
                    <i class="fas fa-receipt"></i>
                    <span>Expenses</span>
                </a>
                <a href="income.html" class="nav-item active">
                    <i class="fas fa-wallet"></i>
                    <span>Income</span>
                </a>
                <a href="budgets.html" class="nav-item">
                    <i class="fas fa-bullseye"></i>
                    <span>Budgets</span>
                </a>
                <a href="analytics.html" class="nav-item">
                    <i class="fas fa-chart-line"></i>
                    <span>Analytics</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-profile-badge">
                    <div class="user-info">
                        <div class="user-avatar" id="user-avatar">U</div>
                        <div class="user-details">
                            <h4 id="user-full-name">User</h4>
                            <p id="user-email">user@example.com</p>
                        </div>
                    </div>
                    <button class="btn-logout" id="btn-logout" title="Logout">
                        <i class="fas fa-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-wrapper">
            <div class="topbar">
                <div class="page-header">
                    <h1>Income Management</h1>
                    <p>Track your salary, freelance earnings, dividends, and other revenue streams</p>
                </div>
                <div class="topbar-actions">
                    <button id="btn-open-income-modal" class="btn btn-success">
                        <i class="fas fa-plus"></i> Add Income
                    </button>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2><i class="fas fa-money-bills"></i> All Logged Incomes</h2>
                </div>
                <div class="table-responsive">
                    <table class="custom-table">
                        <thead>
                            <tr>
                                <th>Source / Description</th>
                                <th>Category</th>
                                <th>Amount</th>
                                <th>Payment Method</th>
                                <th>Date</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="incomes-table-tbody">
                            <!-- Dynamic rows -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Add Income Modal -->
    <div class="modal-backdrop" id="income-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-plus-circle" style="color: var(--success);"></i> Record New Income</h3>
                <button class="modal-close" id="btn-close-income-modal"><i class="fas fa-xmark"></i></button>
            </div>
            <form id="income-form">
                <div class="form-group">
                    <label>Amount (₹) *</label>
                    <input type="number" id="income-amount-input" class="form-control" placeholder="0.00" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>Source / Description *</label>
                    <input type="text" id="income-source-input" class="form-control" placeholder="e.g. Monthly Salary, Freelance project" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="income-category-select" class="form-control">
                        <!-- Loaded dynamically -->
                    </select>
                </div>
                <div class="form-group">
                    <label>Payment Method</label>
                    <select id="income-payment-method" class="form-control">
                        <option value="NET_BANKING">Net Banking / Direct Deposit</option>
                        <option value="UPI">UPI</option>
                        <option value="CASH">Cash</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="income-date-input" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-success" style="width: 100%; justify-content: center; margin-top: 8px;">
                    <i class="fas fa-check"></i> Save Income
                </button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
