<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Smart Expense Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-page-container">
        <div class="auth-card">
            <div style="display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 24px;">
                <div class="brand-logo">
                    <i class="fas fa-brain"></i>
                </div>
                <h2 style="font-size: 1.35rem; font-weight: 800; color: var(--text-primary);">
                    SmartExpense <span class="brand-badge">AI</span>
                </h2>
            </div>

            <div class="auth-tabs">
                <div class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Sign In</div>
                <div class="auth-tab" id="tab-register" onclick="switchAuthTab('register')">Create Account</div>
            </div>

            <!-- Login Form -->
            <form id="login-form">
                <div class="form-group">
                    <label>Username or Email</label>
                    <input type="text" id="login-username" class="form-control" placeholder="e.g. johndoe" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 16px;">
                    <i class="fas fa-arrow-right-to-bracket"></i> Sign In to Dashboard
                </button>
            </form>

            <!-- Register Form -->
            <form id="register-form" style="display: none;">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="reg-fullname" class="form-control" placeholder="e.g. John Doe">
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="reg-username" class="form-control" placeholder="e.g. johndoe" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="reg-email" class="form-control" placeholder="e.g. john@example.com" required>
                </div>
                <div class="form-group">
                    <label>Monthly Budget (₹)</label>
                    <input type="number" id="reg-budget" class="form-control" placeholder="e.g. 50000" step="100">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="reg-password" class="form-control" placeholder="Minimum 6 characters" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 16px;">
                    <i class="fas fa-user-plus"></i> Create My Account
                </button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        function switchAuthTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            if (tab === 'login') {
                document.getElementById('tab-login').classList.add('active');
                document.getElementById('login-form').style.display = 'block';
                document.getElementById('register-form').style.display = 'none';
            } else {
                document.getElementById('tab-register').classList.add('active');
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('register-form').style.display = 'block';
            }
        }

        // Login Handler
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;

            try {
                const res = await API.login({ username, password });
                API.setAuth(res);
                showToast('Login successful!', 'success');
                setTimeout(() => window.location.href = 'index.html', 500);
            } catch (err) {
                showToast(err.message, 'error');
            }
        });

        // Register Handler
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('reg-fullname').value.trim();
            const username = document.getElementById('reg-username').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const monthlyBudget = parseFloat(document.getElementById('reg-budget').value) || 0;
            const password = document.getElementById('reg-password').value;

            try {
                const res = await API.register({ fullName, username, email, monthlyBudget, password });
                API.setAuth(res);
                showToast('Account created successfully!', 'success');
                setTimeout(() => window.location.href = 'index.html', 500);
            } catch (err) {
                showToast(err.message, 'error');
            }
        });
    </script>
</body>
</html>
